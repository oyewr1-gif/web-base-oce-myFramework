<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 260 50" width="260" height="50">
  <defs>
    <linearGradient id="primaryGradLight" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#818cf8" />
      <stop offset="50%" stop-color="#6366f1" />
      <stop offset="100%" stop-color="#38bdf8" />
    </linearGradient>
    <linearGradient id="accentGradLight" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#fb7185" />
      <stop offset="100%" stop-color="#f59e0b" />
    </linearGradient>
  </defs>

  <!-- Logo Mark Icon -->
  <g transform="translate(4, 5)">
    <!-- Hexagon base -->
    <path d="M20 2 L38 12 L38 32 L20 42 L2 32 L2 12 Z" fill="url(#primaryGradLight)" />
    <!-- Facets -->
    <path d="M20 2 L38 12 L20 22 L2 12 Z" fill="#ffffff" opacity="0.3" />
    <path d="M20 22 L38 12 L38 32 Z" fill="#000000" opacity="0.18" />
    <!-- Central Rocket Emblem -->
    <path d="M20 10 C21.5 14 24 18 26 21 L23 21 L23 26 L17 26 L17 21 L14 21 C16 18 18.5 14 20 10 Z" fill="#ffffff" />
    <!-- Flame -->
    <path d="M18 27 L22 27 L20 32 Z" fill="url(#accentGradLight)" />
    <!-- Core star sparkle -->
    <circle cx="20" cy="16" r="1.5" fill="#4f46e5" />
  </g>

  <!-- Brand Typography for Dark Backgrounds -->
  <g transform="translate(54, 32)">
    <text font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="21" font-weight="800" letter-spacing="-0.5">
      <tspan fill="#f8fafc">My</tspan><tspan fill="#a5b4fc">Frame</tspan><tspan fill="#38bdf8">Work</tspan>
    </text>
    <rect x="156" y="-17" width="46" height="18" rx="4" fill="#312e81" stroke="#4338ca" stroke-width="1" />
    <text x="162" y="-4" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="700" fill="#c7d2fe" letter-spacing="0.5">CMS</text>
  </g>
</svg>
