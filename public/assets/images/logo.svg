<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 260 50" width="260" height="50">
  <defs>
    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4f46e5" />
      <stop offset="50%" stop-color="#6366f1" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f43f5e" />
      <stop offset="100%" stop-color="#fb923c" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#4f46e5" flood-opacity="0.25" />
    </filter>
  </defs>

  <!-- Logo Mark Icon -->
  <g transform="translate(4, 5)" filter="url(#glow)">
    <!-- Hexagon / Shield base -->
    <path d="M20 2 L38 12 L38 32 L20 42 L2 32 L2 12 Z" fill="url(#primaryGrad)" />
    <!-- Dynamic geometric accent facets -->
    <path d="M20 2 L38 12 L20 22 L2 12 Z" fill="#ffffff" opacity="0.2" />
    <path d="M20 22 L38 12 L38 32 Z" fill="#000000" opacity="0.12" />
    <!-- Central Rocket / Speed Emblem -->
    <path d="M20 10 C21.5 14 24 18 26 21 L23 21 L23 26 L17 26 L17 21 L14 21 C16 18 18.5 14 20 10 Z" fill="#ffffff" />
    <!-- Thrust flame -->
    <path d="M18 27 L22 27 L20 32 Z" fill="url(#accentGrad)" />
    <!-- Core star sparkle -->
    <circle cx="20" cy="16" r="1.5" fill="#4f46e5" />
  </g>

  <!-- Brand Typography -->
  <g transform="translate(54, 32)">
    <text font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="21" font-weight="800" letter-spacing="-0.5">
      <tspan fill="#1e1b4b">My</tspan><tspan fill="#4f46e5">Frame</tspan><tspan fill="#0ea5e9">Work</tspan>
    </text>
    <rect x="156" y="-17" width="46" height="18" rx="4" fill="#e0e7ff" />
    <text x="162" y="-4" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="700" fill="#4338ca" letter-spacing="0.5">CMS</text>
  </g>
</svg>
